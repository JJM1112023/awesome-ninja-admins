name: Link check

# Dead-link detection for README.md. Runs on a weekly schedule (plus manual
# dispatch) rather than on PRs, so third-party outages and link rot never
# block unrelated changes. Failures show up as a red run on the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: README dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check README links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999
            README.md
          fail: true
