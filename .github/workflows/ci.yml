name: CI

on:
  push:
    branches: [master, testing]
  pull_request:
    branches: [testing, master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck version
        run: shellcheck --version
      - name: Lint bash scripts
        run: >-
          shellcheck -s bash -e 1072,1094 -x
          src/*.sh lib/common.sh bin/git-template-full
          scripts/validate-pwa.sh scripts/check-readme.sh scripts/install-hooks.sh
          scripts/check-vault.sh scripts/check-all.sh
          .githooks/pre-push .githooks/post-merge
          .claude/hooks/check-readme-links.sh .claude/hooks/shellcheck-edited.sh

  bats:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Bats version
        run: bats --version
      - name: Run test suite
        run: bats test/

  pwa:
    name: PWA validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate PWA shell
        run: bash scripts/validate-pwa.sh

  readme:
    name: README checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check README quality
        run: bash scripts/check-readme.sh

  vault:
    name: Second brain (vault + console data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generator unit tests
        run: python3 test/gen_secondbrain_test.py
      - name: Vault integrity (links, frontmatter, reachability)
        run: bash scripts/check-vault.sh
      - name: Generated files are committed and current
        run: |
          python3 scripts/gen_secondbrain.py
          if ! git diff --exit-code --stat; then
            echo
            echo "::error::vault/, zero-brain/brain*.js|json or SECOND_BRAIN_INDEX.md is stale."
            echo "Run 'python3 scripts/gen_secondbrain.py' and commit the result."
            exit 1
          fi

  console:
    name: Z.E.R.O. console (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run console behaviour tests
        run: node test/console_test.mjs

  icons:
    name: Icon generator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow
      - name: Run gen_icons smoke test
        run: python3 test/gen_icons_test.py
